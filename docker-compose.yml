services:
  pulsewatch:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      PULSEWATCH_ENV: production
      DATABASE_URL: sqlite:////app/instance/pulsewatch.db
      PORT: "5000"
    volumes:
      - pulsewatch-data:/app/instance
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  pulsewatch-data:
